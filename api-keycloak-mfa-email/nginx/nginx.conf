worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    'rt=$request_time uat=$upstream_response_time '
                    'authz_sub=$user_sub mfa=$mfa_verified';
    access_log /var/log/nginx/access.log main;

    server {
        listen 8080;
        server_name _;

        # ── Static SPA ────────────────────────────────────────────────────────
        root /usr/share/nginx/html;
        index index.html;

        location = / {
            try_files /index.html =404;
        }

        location ~* \.(html|js|css|svg|ico|png|jpg|json|map)$ {
            try_files $uri =404;
            # Demo asset cache-busting: every rebuild changes the file, but
            # browsers love to reuse stale JS. Tell them not to.
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            expires off;
        }

        # ── BFF token endpoint ────────────────────────────────────────────────
        # SPA POSTs auth-code + PKCE verifier (or refresh_token) here. authz
        # forwards to Keycloak's real /token, intercepts the response, and
        # replaces access_token with its JWE-for-BFF wrap before returning.
        # The plain Keycloak JWS never leaves the data center.
        location = /api/token {
            proxy_pass http://authz:9000/token-proxy;
            proxy_set_header Host            $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Content-Type    application/x-www-form-urlencoded;
        }

        # ── BFF: auth_request → authz → forward CLAIMS-AS-HEADERS to API ──────
        # The wrapper terminates token crypto entirely. The API receives plain
        # X-User-* / X-MFA-* / X-User-Roles / X-Bank-Account-Number headers and
        # has zero knowledge of JWT/JWE/Keycloak.
        location /api/ {
            auth_request /_authz;

            # Pull the parsed claims out of the authz sub-request response headers.
            auth_request_set $user_sub      $upstream_http_x_user_sub;
            auth_request_set $user_email    $upstream_http_x_user_email;
            auth_request_set $user_username $upstream_http_x_user_username;
            auth_request_set $user_roles    $upstream_http_x_user_roles;
            auth_request_set $bank_account  $upstream_http_x_bank_account_number;
            auth_request_set $mfa_verified  $upstream_http_x_mfa_verified;
            auth_request_set $mfa_method    $upstream_http_x_mfa_method;
            auth_request_set $wrap_sig      $upstream_http_x_wrapper_signature;
            auth_request_set $wrap_ts       $upstream_http_x_wrapper_timestamp;

            # Strip the inbound bearer entirely — the API doesn't need it and
            # shouldn't see it.
            proxy_set_header Authorization "";

            # Identity propagated as plain headers + HMAC signature that proves
            # the headers came from the wrapper and weren't injected by a peer.
            proxy_set_header X-User-Sub            $user_sub;
            proxy_set_header X-User-Email          $user_email;
            proxy_set_header X-User-Username       $user_username;
            proxy_set_header X-User-Roles          $user_roles;
            proxy_set_header X-Bank-Account-Number $bank_account;
            proxy_set_header X-MFA-Verified        $mfa_verified;
            proxy_set_header X-MFA-Method          $mfa_method;
            proxy_set_header X-Wrapper-Signature   $wrap_sig;
            proxy_set_header X-Wrapper-Timestamp   $wrap_ts;

            proxy_set_header Host            $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_pass http://api:8080;
        }

        # ── Internal auth subrequest ──────────────────────────────────────────
        # nginx forwards the original Authorization header (JWE-for-BFF) to authz.
        # authz returns 200 + claim headers on success, 401 otherwise.
        location = /_authz {
            internal;
            proxy_pass http://authz:9000/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Authorization  $http_authorization;
        }

        # If authz returns 401 (no token, invalid signature, etc.) nginx
        # propagates it as 401 with this body.
        error_page 401 = @unauthorized;
        location @unauthorized {
            default_type application/json;
            return 401 '{"error":"unauthorized — log in at / first, complete email OTP"}';
        }
    }
}
